<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Mi reserva · balé</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F3E4D8">
<script src="js/modo-temprano.js"></script>
<link rel="icon" href="img/bale-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/bale.css">
<link rel="stylesheet" href="css/mi-reserva.css">
<script src="js/core.js" defer></script>
<script src="js/sistema.js" defer></script>
<script src="js/calendario.js" defer></script>
<script src="js/mi-reserva.js" defer></script>
</head>
<body data-page="bale-mi-reserva">
<header class="btop">
  <div class="wrap">
    <a class="bmark" href="./" aria-label="balé, ir a la página"><img src="img/bale-logo-transparente.webp" alt="" width="1040" height="538"></a>
    <button class="modebtn" id="modeBtn" type="button" aria-label="Cambiar a modo oscuro" title="Modo oscuro / claro"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <a class="tores" href="./#horario">Horario</a>
  </div>
</header>

<main class="wrap bale mres">
  <span class="b-kick">balé · mi reserva</span>
  <h1 id="mrTitle">Tu reserva</h1>
  <span class="cinta" aria-hidden="true"></span>
  <div id="mrEstado" role="status" aria-live="polite"><p class="mrcarga">Buscando tu reserva…</p></div>
  <dl class="sum" id="mrSum" hidden></dl>
  <div class="paybox" id="mrPay" hidden></div>
  <div class="bkbtns" id="mrBtns" hidden>
    <button class="bbtn solid" type="button" id="mrCancel" hidden>Cancelar mi reserva</button>
    <button class="bbtn line" type="button" id="mrIcs" hidden>Agregar a mi calendario</button>
    <a class="bbtn line" id="mrHorario" href="./#horario">Ver el horario</a>
    <button class="bbtn line" type="button" id="mrWa">Escribir por WhatsApp</button>
  </div>
</main>

<dialog class="book mrdlg" id="mrDlg" aria-labelledby="mrDlgT">
  <div class="bk">
    <h2 id="mrDlgT">¿Cancelar tu reserva?</h2>
    <p id="mrDlgTxt"></p>
    <p class="bkwarn" id="mrTarde" hidden></p>
    <div class="bkbtns">
      <button class="bbtn solid" type="button" id="mrSi">Sí, cancelar</button>
      <button class="bbtn line" type="button" id="mrNo">No, mantenerla</button>
    </div>
  </div>
</dialog>

<footer class="bfoot">
  <div class="wrap">
    <span>balé · Barre, Ballet &amp; Pilates · La Vega, República Dominicana</span>
    <a href="privacidad.html">Aviso de privacidad</a>
  </div>
</footer>
</body>
</html>
